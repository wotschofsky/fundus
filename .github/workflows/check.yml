name: Check
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: 26, cache: pnpm, cache-dependency-path: pnpm-lock.yaml}
      - run: pnpm install --frozen-lockfile && pnpm build
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libflac-dev
      - run: cargo fmt --all --check && cargo clippy --all-targets -- -D warnings && cargo test --locked
      - run: scripts/test-native-codec.sh
  native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: 26}
      - run: swift test --package-path native/apple
      - run: swift test --package-path apps/macos
      - run: scripts/package-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos-local-bundle
          path: |
            build/VaultUploader-*.zip
            build/VaultUploader-*.dmg
            build/VaultUploader-*.sha256
          if-no-files-found: error
      - run: pnpm install --frozen-lockfile && pnpm --dir apps/mobile check
