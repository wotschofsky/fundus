name: Check
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite://${{ github.workspace }}/data/vault.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: 26, cache: pnpm, cache-dependency-path: pnpm-lock.yaml}
      - run: pnpm install --frozen-lockfile && pnpm build
      - run: pnpm --dir web test
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libflac-dev
      - name: Install SQLx migration CLI
        run: cargo install sqlx-cli --version 0.8.6 --locked --no-default-features --features sqlite
      - name: Create development database from migrations
        run: mkdir -p data && cargo sqlx database setup --source crates/server/migrations
      - run: cargo fmt --all --check && cargo clippy --all-targets -- -D warnings && cargo test --locked
      - run: scripts/test-native-codec.sh
  native:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: 26}
      - run: swift test --package-path native/apple
      - run: swift test --package-path apps/macos
      - run: scripts/package-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos-local-bundle
          path: |
            build/Fundus-*.zip
            build/Fundus-*.dmg
            build/Fundus-*.sha256
          if-no-files-found: error
      - run: pnpm install --frozen-lockfile && pnpm --dir apps/mobile check
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      # Gradle configures the native build even for JVM tests, so the pinned NDK (ndkVersion in
      # apps/android/app/build.gradle.kts) and CMake must be installed; Gradle fetches the platform.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools ndk;28.2.13676358 cmake;3.22.1
      - run: scripts/fetch-native-deps.sh
      - run: ./gradlew testDebugUnitTest --console=plain
        working-directory: apps/android
      # 16 KB memory pages only concern 64-bit processes, so the 32-bit library may keep 4 KB.
      - name: 64-bit native libraries load on 16 KB-page devices
        working-directory: apps/android
        run: |
          set -euo pipefail
          ./gradlew :app:externalNativeBuildRelease --console=plain
          readelf=$(ls "$ANDROID_HOME"/ndk/*/toolchains/llvm/prebuilt/*/bin/llvm-readelf | head -1)
          libs=$(find app/build/intermediates/cxx -path '*/arm64-v8a/*.so' -o -path '*/x86_64/*.so')
          test -n "$libs"
          for so in $libs; do
            aligns=$("$readelf" -lW "$so" | awk '$1 == "LOAD" { print $NF }')
            test -n "$aligns"
            for align in $aligns; do
              if [ $((align)) -lt 16384 ]; then echo "$so: a LOAD segment is aligned to $align"; exit 1; fi
            done
          done
