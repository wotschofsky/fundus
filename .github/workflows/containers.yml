name: Containers

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/check.yml

  image:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Resolve image name
        id: names
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build native test image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: vault-test:${{ matrix.arch }}
          cache-from: type=gha,scope=vault-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=vault-${{ matrix.arch }}
      - name: Test packaged pipeline without external API calls
        run: python3 scripts/container-smoke.py vault-test:${{ matrix.arch }}
      - name: Scan packaged dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vault-test:${{ matrix.arch }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          output: trivy-${{ matrix.arch }}.txt
      - name: Save scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scan-${{ matrix.arch }}
          path: trivy-${{ matrix.arch }}.txt
          if-no-files-found: ignore
      - name: Sign in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested architecture
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.names.outputs.image }}:sha-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=vault-${{ matrix.arch }}
          provenance: mode=max
          sbom: true

  manifest:
    if: github.event_name != 'pull_request'
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Publish and verify combined image
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=(--tag "$image:sha-${GITHUB_SHA}")
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tip="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
            if [[ "$tip" == "$GITHUB_SHA" ]]; then tags+=(--tag "$image:latest"); fi
          fi
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)*$ ]]
            tags+=(--tag "$image:${version//+/_}")
          fi
          docker buildx imagetools create "${tags[@]}" "$image:sha-${GITHUB_SHA}-amd64" "$image:sha-${GITHUB_SHA}-arm64"
          docker buildx imagetools inspect "$image:sha-${GITHUB_SHA}" | tee manifest.txt
          grep -q 'Platform:.*linux/amd64' manifest.txt
          grep -q 'Platform:.*linux/arm64' manifest.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: manifest
          path: manifest.txt
          if-no-files-found: ignore
